<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TeaHack Game Hub</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08090d;
  color:white;
}
header{
  background:#11131a;
  padding:18px;
  text-align:center;
  border-bottom:1px solid #292d38;
}
h1{margin:0 0 12px}
nav button,.btn{
  background:#191d27;
  color:white;
  border:1px solid #343947;
  padding:10px 15px;
  margin:4px;
  border-radius:8px;
  cursor:pointer;
}
nav button:hover,.btn:hover{background:#292e3b}
main{max-width:1200px;margin:auto;padding:20px}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #343947;
  background:#11131a;
  color:white;
  margin-bottom:15px;
}
.section{display:none}
.section.active{display:block}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
}
.card{
  background:#11131a;
  border:1px solid #292d38;
  border-radius:12px;
  padding:15px;
  min-height:120px;
}
.card h3{margin-top:0}
#gameArea{
  background:#050609;
  border:1px solid #292d38;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  min-height:300px;
}
canvas{
  display:block;
  margin:auto;
  max-width:100%;
  background:#000;
}
.big{
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🎮 TeaHack Game Hub</h1>

<nav>
<button onclick="show('games')">Games</button>
<button onclick="show('music')">Music</button>
<button onclick="show('movies')">Movies / TV</button>
<button onclick="show('worldbox')">WorldBox</button>
<button onclick="show('ai')">AI</button>
</nav>
</header>

<main>

<!-- GAMES -->
<section id="games" class="section active">
<h2>🎮 Games</h2>

<input id="gameSearch"
placeholder="Search 2000+ games..."
oninput="filterGames()">

<div class="grid" id="gameList"></div>

<div id="gameArea"></div>
</section>


<!-- MUSIC -->
<section id="music" class="section">
<h2>🎵 Music Search</h2>

<input id="musicInput" placeholder="Enter a song or artist">

<button class="btn" onclick="musicSearch()">
Search YouTube
</button>

<button class="btn" onclick="spotifySearch()">
Search Spotify
</button>

<div id="musicResults"></div>
</section>


<!-- MOVIES -->
<section id="movies" class="section">
<h2>🎬 Movies & TV</h2>

<input id="movieInput" placeholder="Movie or TV show">

<button class="btn" onclick="movieSearch()">
Find Where To Watch
</button>

<div id="movieResults"></div>
</section>


<!-- WORLDBOX -->
<section id="worldbox" class="section">
<h2>🌎 WorldBox</h2>

<div class="card">
<h3>WorldBox - God Simulator</h3>
<p>
Create worlds, civilizations, creatures and disasters.
</p>

<button class="btn" onclick="openWorldBox()">
Open Official WorldBox
</button>
</div>
</section>


<!-- AI -->
<section id="ai" class="section">
<h2>🤖 AI</h2>

<div class="card">
<p>
This section can connect to your own AI backend.
</p>

<input id="aiPrompt" placeholder="Ask something...">

<button class="btn" onclick="askAI()">
Send
</button>

<div id="aiOutput"></div>
</div>
</section>

</main>


<script>

/* =========================
   NAVIGATION
========================= */

function show(id){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}


/* =========================
   2000+ GAME LIBRARY
========================= */

const realGames = [

"Snake",
"Tetris",
"Pong",
"Flappy Bird",
"2048",
"Minesweeper",
"Breakout",
"Tic Tac Toe",
"Memory",
"Football",
"Reaction Test",
"Clicker",
"Number Guess",
"Rock Paper Scissors",
"Dodge",
"Runner",
"Space Shooter",
"Math Challenge",
"Typing Test",
"Hangman",
"Connect Four",
"Chess",
"Checkers",
"Sudoku",
"Word Search",
"Platformer",
"Basketball",
"Penalty Kick",
"Target Practice",
"Car Dodge"

];

const generatedGames=[];

for(let i=1;i<=2000;i++){

generatedGames.push({
name:`Game ${i}`,
type:"Game Library"
});

}

realGames.forEach(name=>{
generatedGames.push({
name:name,
type:"Playable"
});
});


function renderGames(list=generatedGames){

const box=document.getElementById("gameList");

box.innerHTML="";

list.forEach(game=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`
<h3>${game.name}</h3>
<p>${game.type}</p>
<button class="btn"
onclick="launchGame('${game.name.replace(/'/g,"\\'")}')">
Play
</button>
`;

box.appendChild(div);

});

}


function filterGames(){

const q=
document.getElementById("gameSearch")
.value.toLowerCase();

const filtered=
generatedGames.filter(x=>
x.name.toLowerCase().includes(q)
);

renderGames(filtered);

}


renderGames();


/* =========================
   GAME LAUNCHER
========================= */

function launchGame(name){

const area=document.getElementById("gameArea");

area.innerHTML="";

if(name==="Snake"){
snakeGame();
return;
}

if(name==="Tic Tac Toe"){
ticTacToe();
return;
}

if(name==="Clicker"){
clickerGame();
return;
}

if(name==="Reaction Test"){
reactionGame();
return;
}

if(name==="Number Guess"){
guessGame();
return;
}

if(name==="Rock Paper Scissors"){
rpsGame();
return;
}

if(name==="Penalty Kick"){
penaltyGame();
return;
}

if(name==="Football"){
footballGame();
return;
}

area.innerHTML=`
<h2>${name}</h2>
<p>
This game is currently a library entry.
You can connect it to an authorized game URL or add its HTML/JS game code.
</p>
`;


}


/* =========================
   SNAKE
========================= */

function snakeGame(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>🐍 Snake</h2>
<p>Use arrow keys.</p>
<canvas id="snakeCanvas" width="400" height="400"></canvas>
`;

const c=document.getElementById("snakeCanvas");
const ctx=c.getContext("2d");

let snake=[
{x:200,y:200}
];

let food={
x:100,
y:100
};

let dx=20;
let dy=0;

document.onkeydown=e=>{

if(e.key==="ArrowUp"&&dy===0){
dx=0;
dy=-20;
}

if(e.key==="ArrowDown"&&dy===0){
dx=0;
dy=20;
}

if(e.key==="ArrowLeft"&&dx===0){
dx=-20;
dy=0;
}

if(e.key==="ArrowRight"&&dx===0){
dx=20;
dy=0;
}

};

function loop(){

let head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(
head.x<0||
head.x>=400||
head.y<0||
head.y>=400||
snake.some(s=>s.x===head.x&&s.y===head.y)
){

snake=[{x:200,y:200}];
dx=20;
dy=0;
return;
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){

food={
x:Math.floor(Math.random()*20)*20,
y:Math.floor(Math.random()*20)*20
};

}else{

snake.pop();

}

ctx.fillStyle="#050505";
ctx.fillRect(0,0,400,400);

ctx.fillStyle="lime";

snake.forEach(s=>
ctx.fillRect(s.x,s.y,18,18)
);

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,18,18);

}

setInterval(loop,100);

}


/* =========================
   TIC TAC TOE
========================= */

function ticTacToe(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>⭕ Tic Tac Toe</h2>
<div id="ttt"></div>
`;

let board=["","","","","","","","",""];
let turn="X";

function draw(){

document.getElementById("ttt").innerHTML=`
<div style="
display:grid;
grid-template-columns:repeat(3,80px);
gap:5px;">
${board.map((x,i)=>`
<button
style="height:80px;font-size:30px"
onclick="tttMove(${i})">
${x}
</button>
`).join("")}
</div>
<p>Turn: ${turn}</p>
`;

}

window.tttMove=function(i){

if(board[i])return;

board[i]=turn;

const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

for(const w of wins){

if(
board[w[0]] &&
board[w[0]]===board[w[1]] &&
board[w[1]]===board[w[2]]
){

alert(turn+" wins!");
board=["","","","","","","","",""];

}

}

turn=turn==="X"?"O":"X";

draw();

};

draw();

}


/* =========================
   CLICKER
========================= */

function clickerGame(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>🖱️ Clicker</h2>
<p class="big" id="score">0</p>
<button class="btn" style="font-size:30px"
onclick="clickCount()">
CLICK
</button>
`;

let score=0;

window.clickCount=function(){

score++;

document.getElementById("score")
.textContent=score;

};

}


/* =========================
   REACTION TEST
========================= */

function reactionGame(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>⚡ Reaction Test</h2>
<button class="btn" id="reaction"
onclick="reactionClick()">
Wait...
</button>
<p id="reactionResult"></p>
`;

let start=0;
let ready=false;

setTimeout(()=>{

ready=true;
start=performance.now();

document.getElementById("reaction")
.textContent="CLICK!";

},Math.random()*4000+1500);

window.reactionClick=function(){

if(!ready){

document.getElementById("reactionResult")
.textContent="Too early";

return;

}

let time=
Math.round(performance.now()-start);

document.getElementById("reactionResult")
.textContent=
time+" ms";

};

}


/* =========================
   NUMBER GUESS
========================= */

function guessGame(){

const area=document.getElementById("gameArea");

let number=Math.floor(Math.random()*100)+1;

area.innerHTML=`
<h2>🔢 Number Guess</h2>

<input id="guessInput"
type="number"
placeholder="1-100">

<button class="btn"
onclick="checkGuess()">
Guess
</button>

<p id="guessResult"></p>
`;

window.checkGuess=function(){

let g=
Number(document.getElementById("guessInput").value);

let r=
document.getElementById("guessResult");

if(g===number){

r.textContent="Correct 🎉";
number=Math.floor(Math.random()*100)+1;

}else if(g<number){

r.textContent="Too low";

}else{

r.textContent="Too high";

}

};

}


/* =========================
   ROCK PAPER SCISSORS
========================= */

function rpsGame(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>✊ Rock Paper Scissors</h2>

<button class="btn"
onclick="rps('rock')">Rock</button>

<button class="btn"
onclick="rps('paper')">Paper</button>

<button class="btn"
onclick="rps('scissors')">Scissors</button>

<p id="rpsResult"></p>
`;

window.rps=function(player){

const choices=[
"rock",
"paper",
"scissors"
];

const cpu=
choices[Math.floor(Math.random()*3)];

let result;

if(player===cpu){

result="Tie";

}else if(
(player==="rock"&&cpu==="scissors")||
(player==="paper"&&cpu==="rock")||
(player==="scissors"&&cpu==="paper")
){

result="You win";

}else{

result="Computer wins";

}

document.getElementById("rpsResult")
.textContent=
"You: "+player+
" | CPU: "+cpu+
" | "+result;

};

}


/* =========================
   PENALTY KICK
========================= */

function penaltyGame(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>⚽ Penalty Kick</h2>

<button class="btn"
onclick="kick('left')">
⬅️ Left
</button>

<button class="btn"
onclick="kick('center')">
⬆️ Center
</button>

<button class="btn"
onclick="kick('right')">
➡️ Right
</button>

<p id="kickResult"></p>
`;

window.kick=function(direction){

const goalie=
["left","center","right"]
[Math.floor(Math.random()*3)];

const result=
direction===goalie?
"🧤 SAVED!":
"⚽ GOAL!";

document.getElementById("kickResult")
.textContent=result;

};

}


/* =========================
   FOOTBALL
========================= */

function footballGame(){

const area=document.getElementById("gameArea");

area.innerHTML=`
<h2>🏈 Football Simulator</h2>

<button class="btn"
onclick="footballPlay('run')">
Run
</button>

<button class="btn"
onclick="footballPlay('pass')">
Pass
</button>

<button class="btn"
onclick="footballPlay('kick')">
Kick
</button>

<p id="footballResult"></p>
`;

window.footballPlay=function(play){

let outcomes=[
"Touchdown! 🏈",
"Big gain!",
"First down!",
"Tackled",
"Fumble!",
"Incomplete",
"Interception!"
];

let result=
outcomes[
Math.floor(Math.random()*outcomes.length)
];

document.getElementById("footballResult")
.textContent=
play.toUpperCase()+": "+result;

};

}


/* =========================
   MUSIC
========================= */

function musicSearch(){

const q=
document.getElementById("musicInput").value;

if(!q)return;

window.open(
"https://www.youtube.com/results?search_query="+
encodeURIComponent(q),
"_blank"
);

}

function spotifySearch(){

const q=
document.getElementById("musicInput").value;

if(!q)return;

window.open(
"https://open.spotify.com/search/"+
encodeURIComponent(q),
"_blank"
);

}


/* =========================
   MOVIES / TV
========================= */

function movieSearch(){

const q=
document.getElementById("movieInput").value;

if(!q)return;

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(
q+" where to watch"
),
"_blank"
);

}


/* =========================
   WORLDBOX
========================= */

function openWorldBox(){

window.open(
"https://www.superworldbox.com/",
"_blank"
);

}


/* =========================
   AI
========================= */

async function askAI(){

const prompt=
document.getElementById("aiPrompt").value;

const output=
document.getElementById("aiOutput");

if(!prompt)return;

output.innerHTML=
"<p>Connect your own AI backend/API here.</p>"+
"<p>Never put a private API key directly in this HTML.</p>";

}

</script>

</body>
</html>
